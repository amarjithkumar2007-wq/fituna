name: Release

# Publishes to PyPI when a GitHub release is published, via PyPI Trusted
# Publishing (OIDC). No API token is stored anywhere: PyPI trusts this
# workflow file, in this repository, running in the `pypi` environment.
# The `pypi` environment only accepts deployments from `v*` tags.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest build
      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import fituna; print(fituna.__version__)')"
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg"
      - name: Unit tests
        run: pytest -q
      - name: Build sdist and wheel
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fituna/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
