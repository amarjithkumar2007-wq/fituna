[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fituna"
version = "0.3.2"
description = "Hardware-aware auto-tuner that finds the smallest llama.cpp GGUF quantization + runtime config meeting a target throughput and quality-loss budget."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "FiTuna contributors" }]
keywords = ["llama.cpp", "gguf", "quantization", "llm", "inference", "benchmarking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Hardware",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
fituna = "fituna.cli:main"
fituna-mcp = "fituna.mcp_server:main"

[project.urls]
Homepage = "https://github.com/leeyunseokarchive/fituna"
Repository = "https://github.com/leeyunseokarchive/fituna"
Issues = "https://github.com/leeyunseokarchive/fituna/issues"
Changelog = "https://github.com/leeyunseokarchive/fituna/blob/main/CHANGELOG.md"
Documentation = "https://github.com/leeyunseokarchive/fituna/blob/main/docs/ARCHITECTURE.md"

[tool.setuptools.packages.find]
include = ["fituna*"]

[tool.setuptools.package-data]
fituna = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
